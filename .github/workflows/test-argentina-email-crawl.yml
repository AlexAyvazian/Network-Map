name: Verify Argentina email enrichment extractor
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/argentina-contact-email-crawl.py"
      - "scripts/tests/test_argentina_contact_email_crawl.py"
      - "scripts/official-registry-contact-enrichment.sql"
      - ".github/workflows/test-argentina-email-crawl.yml"
  push:
    branches: [main]
    paths:
      - "scripts/argentina-contact-email-crawl.py"
      - "scripts/tests/test_argentina_contact_email_crawl.py"
      - "scripts/official-registry-contact-enrichment.sql"
      - ".github/workflows/test-argentina-email-crawl.yml"
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify extraction and safety rules
        run: python -m unittest discover -s scripts/tests -p 'test_argentina_contact_email_crawl.py' -v
